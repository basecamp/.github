name: Sync Dependabot action pin comments

# Dependabot's github-actions updater bumps SHA pins but cannot rewrite the
# `# vX.Y.Z` comment on lines that carry a second trailing comment (e.g. a
# zizmor suppression), so those comments go stale on every actions-group PR.
#
# Reusable workflow (hardened model from openclaw-basecamp): the caller
# triggers it on workflow_run after CI completes on a Dependabot actions
# branch, and it rewrites the stale comments in place. Head-branch files are
# edited as *data* only — no head-branch code is ever executed, no `uses:`
# steps run, and the updater script is embedded in this workflow file, so the
# caller's SHA pin covers it byte for byte (scripts/ holds the tested source;
# CI enforces the embedded copy matches). The push uses a dedicated write deploy
# key: GitHub refuses to let App tokens (GITHUB_TOKEN included) create or
# update workflow files, and the comment fix is exactly that; SSH deploy keys
# are exempt.
#
# Caller contract (thin caller in each repo):
#   on:
#     workflow_run:      # needs a dangerous-triggers ignore with rationale
#       workflows: [<name of the PR CI workflow>]
#       types: [completed]
#       branches: ["dependabot/github_actions/**"]   # no runs created for other branches
#     workflow_dispatch:
#       inputs: {branch: {type: string, required: true}, e2e: {type: boolean, default: false}}
#   jobs:
#     sync:
#       uses: basecamp/.github/.github/workflows/dependabot-sync-actions-comments.yml@<sha>
#       with: {ci-workflow-name: <same name>, branch: "${{ inputs.branch || '' }}", e2e: "${{ inputs.e2e || false }}"}
#       permissions: {contents: read, actions: write, pull-requests: read}
#       secrets: inherit
#   plus a `dependabot-sync` environment (deployment branches: default branch
#   only) holding the SYNC_ACTIONS_DEPLOY_KEY write deploy key.

on:
  workflow_call:
    inputs:
      ci-workflow-name:
        description: >-
          Name of the pull_request CI workflow (the one the caller's
          workflow_run trigger names). Used to verify CI started on the
          pushed head.
        required: true
        type: string
      default-branch:
        description: The caller repository's default branch
        required: false
        default: main
        type: string
      branch:
        description: Dependabot branch to sync (workflow_dispatch path only)
        required: false
        default: ""
        type: string
      e2e:
        description: >-
          E2E proof mode: expect a draft PR authored by the dispatcher on a
          dependabot/github_actions/e2e-proof-* branch
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  sync:
    name: Sync action pin comments
    runs-on: ubuntu-latest
    # The write deploy key lives in the caller repo's `dependabot-sync`
    # environment, whose deployment branch policy is restricted to the default
    # branch: only default-branch runs of this job can read it, and no other
    # workflow in the repo can. Callers pass `secrets: inherit` — environment
    # secrets cannot be forwarded explicitly; they resolve only when the
    # running job declares the environment.
    environment: dependabot-sync
    # Serialize per branch: repos whose PR CI spans multiple workflow_run
    # completions (or two workflows sharing one name) trigger several runs per
    # head; the queued run then sees the head moved and skips cleanly instead
    # of racing the lease push.
    concurrency:
      group: dependabot-sync-actions-comments-${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    # Two explicit event paths:
    #   - workflow_dispatch: must run from the default branch so the workflow
    #     definition and script pin are reviewed code (a non-default-branch
    #     dispatch would execute unreviewed content with push credentials).
    #   - workflow_run: only same-repo Dependabot-actored pull_request CI runs
    #     on dependabot/github_actions/* branches. The pull_request gate also
    #     breaks the re-trigger loop: the CI run this workflow dispatches after
    #     pushing is a workflow_dispatch run and is filtered out here.
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == format('refs/heads/{0}', inputs.default-branch)
      ) || (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.actor.login == 'dependabot[bot]' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'dependabot/github_actions/')
      )
    permissions:
      contents: read # fetch the repo over https; the push itself uses the deploy key
      actions: write # approve held pull_request runs so required checks attach
      pull-requests: read # `gh pr list` in the pull request gate
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Set up git authentication
        run: |
          gh auth setup-git
          git ls-remote "https://github.com/${GITHUB_REPOSITORY}" HEAD > /dev/null

      - name: Resolve and validate the target branch and head SHA
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            BRANCH="$INPUT_BRANCH"
          else
            BRANCH="$RUN_HEAD_BRANCH"
          fi
          if ! printf '%s' "$BRANCH" | grep -qE '^dependabot/github_actions/[A-Za-z0-9._/-]+$'; then
            echo "::error::branch is not an allowed dependabot/github_actions/* branch"
            exit 1
          fi

          # The captured SHA is both the detached checkout and the push-lease
          # expectation. For workflow_run it is the audited head_sha; for
          # dispatch it is resolved from the remote exactly once, here.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            HEAD_SHA="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" "refs/heads/${BRANCH}" | cut -f1)"
            if [ -z "$HEAD_SHA" ]; then
              echo "::error::branch not found on the remote"
              exit 1
            fi
          else
            HEAD_SHA="$RUN_HEAD_SHA"
          fi
          if ! printf '%s' "$HEAD_SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::resolved head SHA is not a 40-hex commit id"
            exit 1
          fi

          { echo "branch=$BRANCH"; echo "sha=$HEAD_SHA"; } >> "$GITHUB_OUTPUT"

      # Exactly one open same-repo PR for the branch, base = default branch,
      # head still at the captured SHA. Normal paths additionally require the
      # Dependabot App as PR author (gh reports it as app/dependabot —
      # distinct from the dependabot[bot] *actor* checked in the job `if:`).
      # E2E dispatch instead requires a draft PR authored by the dispatching
      # human on a dedicated e2e-proof branch. Gate mismatches exit cleanly
      # without writing.
      - name: Verify the pull request gate
        id: gate
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
          HEAD_SHA: ${{ steps.target.outputs.sha }}
          BASE_BRANCH: ${{ inputs.default-branch }}
          INPUT_E2E: ${{ inputs.e2e }}
          DISPATCHER: ${{ github.actor }}
        run: |
          skip() { echo "::notice::$1"; echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0; }

          prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base "$BASE_BRANCH" --head "$BRANCH" \
            --json number,headRefOid,isCrossRepository,isDraft,author)"
          count="$(jq 'length' <<<"$prs")"
          [ "$count" = "1" ] || skip "expected exactly one open PR for the branch, found $count"

          cross="$(jq -r '.[0].isCrossRepository' <<<"$prs")"
          oid="$(jq -r '.[0].headRefOid' <<<"$prs")"
          author="$(jq -r '.[0].author.login' <<<"$prs")"
          draft="$(jq -r '.[0].isDraft' <<<"$prs")"

          [ "$cross" = "false" ] || skip "PR head is not in this repository"
          [ "$oid" = "$HEAD_SHA" ] || skip "PR head has moved past the captured SHA; a later run will pick it up"

          if [ "$INPUT_E2E" = "true" ]; then
            case "$BRANCH" in
              dependabot/github_actions/e2e-proof-*) ;;
              *) echo "::error::e2e mode requires a dependabot/github_actions/e2e-proof-* branch"; exit 1 ;;
            esac
            if [ "$draft" != "true" ] || [ "$author" != "$DISPATCHER" ]; then
              echo "::error::e2e mode requires a draft PR authored by the dispatcher"
              exit 1
            fi
          else
            [ "$author" = "app/dependabot" ] || skip "PR is not authored by the Dependabot app"
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

      # Fresh clone pinned to the captured head SHA (not the mutable branch).
      # The head branch is fetched as data only — nothing from it is executed.
      - name: Fetch the head commit
        if: steps.gate.outputs.proceed == 'true'
        env:
          HEAD_SHA: ${{ steps.target.outputs.sha }}
        run: |
          git init -q repo
          cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}"
          git fetch -q --no-tags --depth 1 origin "$HEAD_SHA"
          git checkout -q --detach "$HEAD_SHA"

      # The updater script is embedded here so the caller's SHA pin on this
      # reusable workflow covers it byte for byte — no runtime fetch, no
      # mutable ref, no extra permissions. scripts/sync-action-pin-comments.mjs
      # in basecamp/.github is the tested source of truth; CI fails if this
      # embedded copy drifts from it (scripts/check-embedded-sync.sh).
      - name: Materialize the trusted updater script
        if: steps.gate.outputs.proceed == 'true'
        run: |
          cat > "$RUNNER_TEMP/sync.mjs" <<'SYNC_MJS'
          #!/usr/bin/env node
          // Sync the trailing `# vX.Y.Z` comments on SHA-pinned `uses:` lines in
          // .github/workflows with the tags each pinned SHA actually points at.
          //
          // Dependabot's github-actions updater rewrites SHA pins but cannot rewrite the
          // version comment on lines that carry a second trailing comment (e.g. a
          // `# zizmor: ignore[...]` suppression), leaving the comment stale. This script
          // applies zizmor's documented rule instead: the comment token must name a tag
          // that points at the pinned SHA. Everything after the token — including zizmor
          // annotations — is preserved byte for byte.
          //
          // Zero dependencies; pure core (exported for tests) + thin I/O shell.
          //
          // Usage:
          //   node scripts/sync-action-pin-comments.mjs           # rewrite in place
          //   node scripts/sync-action-pin-comments.mjs --check   # report only; exit 1 if stale
          //
          // Exit codes: 0 = in sync (or successfully rewritten); 1 = --check found stale
          // comments; 2 = error (resolution failure, malformed data, guard trip) — the
          // tree is left untouched.

          import { execFile } from "node:child_process";
          import { lstatSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { pathToFileURL } from "node:url";
          import { promisify } from "node:util";

          const execFileAsync = promisify(execFile);

          // ---------------------------------------------------------------------------
          // Pure core
          // ---------------------------------------------------------------------------

          // Groups partition the whole line: prefix / action path / SHA / comment
          // lead-in / version token / rest-of-line (verbatim, carries any annotations).
          export const PIN_LINE_RE = /^(\s*(?:-\s+)?uses:\s+)([\w.-]+\/[\w./-]+)@([0-9a-f]{40})(\s+#\s*)(v?\d[^\s#]*)(.*)$/;

          // Tags eligible as version comments: v-optional dotted numerics with an
          // optional prerelease suffix.
          export const TAG_RE = /^v?\d+(\.\d+){0,2}(-[0-9A-Za-z.-]+)?$/;

          const LS_REMOTE_LINE_RE = /^([0-9a-f]{40})\trefs\/tags\/([^\s^]+)(\^\{\})?$/;

          export class SyncError extends Error {}

          /** Parse one workflow line; null if it is not a SHA-pinned uses line with a version comment. */
          export function parsePinnedLine(line) {
            const m = PIN_LINE_RE.exec(line);
            if (!m) return null;
            const [, prefix, action, sha, leadIn, token, rest] = m;
            return { prefix, action, sha, leadIn, token, rest };
          }

          /** owner/repo for an action path, or null for paths that are not resolvable GitHub repos. */
          export function repoKeyFor(action) {
            const segments = action.split("/");
            if (segments.length < 2) return null;
            const [owner, repo] = segments;
            const valid = (s) => /^[\w.-]+$/.test(s) && s !== "." && s !== "..";
            return valid(owner) && valid(repo) ? `${owner}/${repo}` : null;
          }

          /**
           * Parse `git ls-remote --tags` output into a Map of sha -> [tag, ...].
           * Only version-shaped tags (TAG_RE) are indexed. Peeled `^{}` entries (the
           * commit an annotated tag points at) override the tag-object sha.
           * Throws SyncError on any line that does not have the ls-remote shape.
           */
          export function parseLsRemoteOutput(output) {
            const tagToSha = new Map();
            for (const line of output.split("\n")) {
              if (line === "") continue;
              const m = LS_REMOTE_LINE_RE.exec(line);
              if (!m) throw new SyncError(`malformed ls-remote line: ${JSON.stringify(line)}`);
              const [, sha, tag, peeled] = m;
              if (!TAG_RE.test(tag)) continue;
              if (peeled || !tagToSha.has(tag)) tagToSha.set(tag, sha);
            }
            const shaToTags = new Map();
            for (const [tag, sha] of tagToSha) {
              if (!shaToTags.has(sha)) shaToTags.set(sha, []);
              shaToTags.get(sha).push(tag);
            }
            return shaToTags;
          }

          function parseTag(tag) {
            const m = /^v?(\d+)(?:\.(\d+))?(?:\.(\d+))?(?:-([0-9A-Za-z.-]+))?$/.exec(tag);
            if (!m) return null;
            const nums = [m[1], m[2], m[3]].filter((s) => s !== undefined).map(Number);
            return { nums, pre: m[4] ?? null };
          }

          // semver §11: dot-split identifiers; numeric-only compare numerically and rank
          // below alphanumeric; alphanumeric compare lexically; equal prefix -> more
          // identifiers ranks higher.
          function comparePrerelease(a, b) {
            const as = a.split(".");
            const bs = b.split(".");
            for (let i = 0; i < Math.min(as.length, bs.length); i++) {
              const [x, y] = [as[i], bs[i]];
              if (x === y) continue;
              const xNum = /^\d+$/.test(x);
              const yNum = /^\d+$/.test(y);
              if (xNum && yNum) return Number(x) - Number(y);
              if (xNum !== yNum) return xNum ? -1 : 1;
              return x < y ? -1 : 1;
            }
            return as.length - bs.length;
          }

          /**
           * Order version tags for "best comment token" selection:
           *   1. stable > prerelease
           *   2. numeric comparison, segment-wise with missing segments as 0
           *   3. numerically equal: more explicit segments win (v7.0.0 > v7)
           *   4. both prerelease: semver §11 ordering
           *   5. deterministic tie-break: lexicographic tag name
           * Returns > 0 when a is the better tag.
           */
          export function compareVersionTags(a, b) {
            const pa = parseTag(a);
            const pb = parseTag(b);
            if (!pa || !pb) throw new SyncError(`not a version tag: ${JSON.stringify(!pa ? a : b)}`);
            if ((pa.pre === null) !== (pb.pre === null)) return pa.pre === null ? 1 : -1;
            for (let i = 0; i < 3; i++) {
              const diff = (pa.nums[i] ?? 0) - (pb.nums[i] ?? 0);
              if (diff !== 0) return diff;
            }
            if (pa.nums.length !== pb.nums.length) return pa.nums.length - pb.nums.length;
            if (pa.pre !== null && pb.pre !== null && pa.pre !== pb.pre) return comparePrerelease(pa.pre, pb.pre);
            return a < b ? -1 : a > b ? 1 : 0;
          }

          /** The best version tag from a non-empty list. */
          export function chooseBestTag(tags) {
            if (!tags || tags.length === 0) throw new SyncError("chooseBestTag: no tags");
            return tags.reduce((best, tag) => (compareVersionTags(tag, best) > 0 ? tag : best));
          }

          /** Every unique owner/repo key referenced by pinned lines across files. */
          export function collectRepoKeys(files) {
            const keys = new Set();
            for (const { content } of files) {
              for (const line of content.split("\n")) {
                const parsed = parsePinnedLine(line);
                if (!parsed) continue;
                const key = repoKeyFor(parsed.action);
                if (key) keys.add(key);
              }
            }
            return [...keys].sort();
          }

          /**
           * Compute all comment edits for `files` given `tagIndex` (repoKey -> Map of
           * sha -> [tags]). All-or-nothing: any unresolved repo or pinned SHA with no
           * matching tag throws SyncError and nothing is returned.
           *
           * Returns { edits, newContents } where edits is
           * [{ path, lineNo, action, sha, oldToken, newToken, oldLine, newLine }] and
           * newContents maps path -> rewritten content for files with edits.
           */
          export function planEdits(files, tagIndex) {
            const edits = [];
            const newContents = new Map();
            for (const { path, content } of files) {
              const lines = content.split("\n");
              let changed = false;
              for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const parsed = parsePinnedLine(line);
                if (!parsed) continue;
                const key = repoKeyFor(parsed.action);
                if (!key) continue;
                const shaToTags = tagIndex.get(key);
                if (!shaToTags) throw new SyncError(`${path}:${i + 1}: no tag data for ${key}`);
                const tags = shaToTags.get(parsed.sha) ?? [];
                if (tags.includes(parsed.token)) continue;
                if (tags.length === 0) {
                  throw new SyncError(`${path}:${i + 1}: no version tag points at ${key}@${parsed.sha}`);
                }
                const newToken = chooseBestTag(tags);
                if (newToken === parsed.token) continue;
                const { prefix, action, sha, leadIn, rest } = parsed;
                const rebuilt = `${prefix}${action}@${sha}${leadIn}${parsed.token}${rest}`;
                if (rebuilt !== line) throw new SyncError(`${path}:${i + 1}: parse did not partition the line exactly`);
                const newLine = `${prefix}${action}@${sha}${leadIn}${newToken}${rest}`;
                edits.push({ path, lineNo: i + 1, action, sha, oldToken: parsed.token, newToken, oldLine: line, newLine });
                lines[i] = newLine;
                changed = true;
              }
              if (changed) newContents.set(path, lines.join("\n"));
            }
            assertOnlyTokensChanged(files, newContents);
            return { edits, newContents };
          }

          /**
           * Guard: every difference between old and new content must be a pinned line
           * whose parse groups are identical except for the version token. Throws
           * SyncError otherwise.
           */
          export function assertOnlyTokensChanged(files, newContents) {
            for (const { path, content } of files) {
              const rewritten = newContents.get(path);
              if (rewritten === undefined) continue;
              const oldLines = content.split("\n");
              const newLines = rewritten.split("\n");
              if (oldLines.length !== newLines.length) throw new SyncError(`${path}: line count changed`);
              for (let i = 0; i < oldLines.length; i++) {
                if (oldLines[i] === newLines[i]) continue;
                const before = parsePinnedLine(oldLines[i]);
                const after = parsePinnedLine(newLines[i]);
                const intact =
                  before &&
                  after &&
                  before.prefix === after.prefix &&
                  before.action === after.action &&
                  before.sha === after.sha &&
                  before.leadIn === after.leadIn &&
                  before.rest === after.rest;
                if (!intact) throw new SyncError(`${path}:${i + 1}: change is not confined to the version token`);
              }
            }
          }

          // ---------------------------------------------------------------------------
          // I/O shell
          // ---------------------------------------------------------------------------

          async function git(args, opts = {}) {
            const { stdout } = await execFileAsync("git", args, { maxBuffer: 16 * 1024 * 1024, ...opts });
            return stdout;
          }

          async function listWorkflowFiles(root) {
            const out = await git(
              ["ls-files", "-z", "--", ":(glob).github/workflows/*.yml", ":(glob).github/workflows/*.yaml"],
              { cwd: root },
            );
            return out
              .split("\0")
              .filter(Boolean)
              .sort()
              .filter((rel) => {
                const stat = lstatSync(join(root, rel), { throwIfNoEntry: false });
                return stat !== undefined && stat.isFile();
              });
          }

          function errorMessage(error) {
            return error instanceof Error ? error.message : String(error);
          }

          async function resolveRepoTags(repoKey) {
            let out;
            try {
              out = await git(["ls-remote", "--tags", `https://github.com/${repoKey}`]);
            } catch (error) {
              throw new SyncError(`git ls-remote failed for ${repoKey}: ${errorMessage(error)}`);
            }
            return parseLsRemoteOutput(out);
          }

          async function main() {
            const check = process.argv.includes("--check");
            const root = (await git(["rev-parse", "--show-toplevel"])).trim();

            const paths = await listWorkflowFiles(root);
            const files = paths.map((path) => ({ path, content: readFileSync(join(root, path), "utf8") }));

            // Phase 1: resolve every remote and compute + validate every edit. Any
            // failure aborts here with the tree untouched.
            const tagIndex = new Map();
            for (const key of collectRepoKeys(files)) {
              tagIndex.set(key, await resolveRepoTags(key));
            }
            const { edits, newContents } = planEdits(files, tagIndex);

            for (const edit of edits) {
              console.log(`${edit.path}:${edit.lineNo}: ${edit.oldToken} -> ${edit.newToken} (${edit.action}@${edit.sha})`);
            }
            if (edits.length === 0) {
              console.log("all action pin comments are in sync");
              return 0;
            }
            if (check) return 1;

            // Phase 2: write, then verify on-disk changes are confined to version tokens.
            for (const [path, content] of newContents) {
              writeFileSync(join(root, path), content);
            }
            try {
              const reread = paths.map((path) => ({
                path,
                content: files.find((f) => f.path === path).content,
                onDisk: readFileSync(join(root, path), "utf8"),
              }));
              assertOnlyTokensChanged(
                reread,
                new Map(reread.filter((f) => newContents.has(f.path)).map((f) => [f.path, f.onDisk])),
              );
            } catch (error) {
              for (const { path, content } of files) {
                if (newContents.has(path)) writeFileSync(join(root, path), content);
              }
              throw new SyncError(`post-write verification failed, original files restored: ${errorMessage(error)}`);
            }
            console.log(`updated ${edits.length} comment${edits.length === 1 ? "" : "s"}`);
            return 0;
          }

          const invokedDirectly = process.argv[1] && import.meta.url === pathToFileURL(process.argv[1]).href;
          if (invokedDirectly) {
            main().then(
              (code) => process.exit(code),
              (error) => {
                console.error(error instanceof SyncError ? `error: ${error.message}` : error);
                process.exit(2);
              },
            );
          }
          SYNC_MJS

      - name: Sync action pin comments
        if: steps.gate.outputs.proceed == 'true'
        working-directory: repo
        run: node "$RUNNER_TEMP/sync.mjs"

      - name: Commit and push behind a lease
        if: steps.gate.outputs.proceed == 'true'
        id: push
        working-directory: repo
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
          HEAD_SHA: ${{ steps.target.outputs.sha }}
          DEPLOY_KEY: ${{ secrets.SYNC_ACTIONS_DEPLOY_KEY }}
        run: |
          finish() { echo "::notice::$1"; echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0; }

          git diff --quiet && finish "action pin comments already in sync; nothing to push"

          # The ID-based noreply address associates the commit with
          # github-actions[bot]; [dependabot skip] lets Dependabot keep
          # force-rebasing the branch above our commit.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- .github/workflows

          # Belt and braces: every staged diff line must be a SHA-pinned
          # `uses:` line — the only thing the updater may touch.
          bad="$(git diff --cached -U0 \
            | grep -E '^[+-]' \
            | grep -vE '^(\+\+\+|---)' \
            | grep -vE '^[+-][[:space:]]*(-[[:space:]]+)?uses:[[:space:]]+[A-Za-z0-9._-]+/[A-Za-z0-9./_-]+@[0-9a-f]{40}[[:space:]]+#' \
            || true)"
          if [ -n "$bad" ]; then
            echo "::error::staged diff touches lines other than pinned uses lines"
            printf '%s\n' "$bad"
            exit 1
          fi
          git diff --cached --quiet && finish "no workflow changes staged; nothing to push"

          git commit -q -m "chore(actions): sync action pin comments [dependabot skip]"

          # The push must use the dedicated write deploy key, not GITHUB_TOKEN:
          # GitHub refuses to let App tokens introduce new workflow-file
          # content ("refusing to allow a GitHub App to create or update
          # workflow ... without `workflows` permission"), and the fixed
          # workflow files are exactly that. SSH deploy keys are exempt. The
          # key exists solely for this workflow's pushes; GitHub's SSH host
          # keys are pinned from the authenticated API rather than trusted on
          # first use.
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::SYNC_ACTIONS_DEPLOY_KEY is not configured in the dependabot-sync environment"
            exit 1
          fi
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key"
          gh api meta --jq '.ssh_keys[]' | sed 's/^/github.com /' > "$RUNNER_TEMP/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/deploy_key -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts -o IdentitiesOnly=yes"

          # Compare-and-swap: succeeds only if the remote branch still equals
          # the SHA we fixed. If Dependabot rebased mid-run this fails cleanly
          # and the next CI completion re-triggers us.
          git push "git@github.com:${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${BRANCH}" --force-with-lease="refs/heads/${BRANCH}:${HEAD_SHA}"
          { echo "pushed=true"; echo "new_head=$(git rev-parse HEAD)"; } >> "$GITHUB_OUTPUT"

      # A deploy-key push fires normal pull_request synchronize events, so CI
      # starts on its own. There is deliberately NO dispatch fallback: a
      # workflow_dispatch run at the branch would execute the branch's own
      # workflow definitions — the freshly bumped, unreviewed action pins —
      # outside the Dependabot-restricted pull_request context, with whatever
      # permissions those jobs declare. If CI ever fails to start, surface a
      # warning for a maintainer instead of dispatching unreviewed code.
      - name: Verify CI started on the new head
        if: steps.push.outputs.pushed == 'true'
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
          NEW_HEAD: ${{ steps.push.outputs.new_head }}
          CI_NAME: ${{ inputs.ci-workflow-name }}
        run: |
          for _ in 1 2 3 4 5 6; do
            count="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
              -f event=pull_request -f branch="$BRANCH" -f per_page=100 \
              --jq '[.workflow_runs[] | select(.head_sha == env.NEW_HEAD and .name == env.CI_NAME)] | length')"
            if [ "${count:-0}" -gt 0 ]; then
              echo "::notice::CI running for ${NEW_HEAD}"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::no pull_request CI run appeared for ${NEW_HEAD}; re-run checks from the PR page (dispatching branch workflows from here would execute unreviewed action pins outside the Dependabot sandbox)"

      # If the pushed head's pull_request runs get held for approval (repos
      # that require Actions approval for first-time contributors), a held run
      # blocks the PR's merge state. Approve every held run for the exact
      # commit this workflow just pushed, and only those. If approval is
      # denied for GITHUB_TOKEN, surface a warning so a maintainer can approve
      # from the PR page.
      - name: Approve held pull_request runs for the pushed head
        if: steps.push.outputs.pushed == 'true'
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
          NEW_HEAD: ${{ steps.push.outputs.new_head }}
        run: |
          # Poll the full window: held runs for the different pull_request
          # workflows can materialize in staggered batches, so an empty
          # snapshot is not proof there is nothing left to approve. Track
          # already-approved run ids — the API can keep reporting them as
          # action_required for a while, and re-approving would double-count
          # or emit spurious warnings.
          approved=""
          for _ in 1 2 3 4 5 6; do
            run_ids="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
              -f event=pull_request -f branch="$BRANCH" -f per_page=100 \
              --jq '.workflow_runs[] | select(.head_sha == env.NEW_HEAD and .conclusion == "action_required") | .id')"
            for run_id in $run_ids; do
              case " $approved " in *" $run_id "*) continue ;; esac
              if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve" > /dev/null; then
                echo "::notice::approved held run ${run_id} for ${NEW_HEAD}"
                approved="$approved $run_id"
              else
                echo "::warning::could not approve held run ${run_id}; approve it manually from the PR page to unblock merging"
              fi
            done
            sleep 10
          done
          count="$(echo "$approved" | wc -w | tr -d ' ')"
          echo "::notice::approved ${count} held run(s) for ${NEW_HEAD}"
