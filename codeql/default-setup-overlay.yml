name: "Basecamp default setup overlay"
# Merged into code scanning default setup on repos whose
# github-codeql-config-file property points here.
# Test scaffolding (engine dummy apps, fixtures) and examples are not
# shipped code; go/log-injection is inherent to proxies that log requests.
paths-ignore:
  - test
  - tests
  - spec
  - "**/test/**"
  - "**/tests/**"
  - "**/spec/**"
  - "**/example/**"
  - "**/examples/**"
query-filters:
  - exclude:
      id:
        - go/log-injection
